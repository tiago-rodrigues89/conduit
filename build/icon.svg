<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#232b40"/>
      <stop offset="0.55" stop-color="#141925"/>
      <stop offset="1" stop-color="#0a0d13"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ab8ff"/>
      <stop offset="1" stop-color="#5ee1e6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#82aaff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#82aaff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
    <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
  <!-- prompt chevron with a soft glow -->
  <path d="M300 360 L470 512 L300 664" fill="none" stroke="#82aaff" stroke-opacity="0.55" stroke-width="78" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)"/>
  <path d="M300 360 L470 512 L300 664" fill="none" stroke="url(#acc)" stroke-width="72" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- cursor -->
  <rect x="530" y="620" width="210" height="64" rx="32" fill="#e8ecf4"/>
</svg>
